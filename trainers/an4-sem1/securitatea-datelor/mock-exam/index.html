          "Mărește timpul de handshake la 4-RTT.",
          "Necesită semnături manuale din partea administratorului."
        ],
        correct: 1,
        explanation: "Pachetele trimise în faza 0-RTT pot fi înregistrate de un atacator și retransmise către server. Dacă cererea este un transfer bancar POST, plata ar putea fi executată de două ori!"
      },
      {
        id: 30,
        category: "Securitate Web - Blind SQLi",
        question: "Care este diferența dintre Boolean-based Blind SQLi și Time-based Blind SQLi?",
        options: [
          "Boolean-based folosește portul 80, Time-based folosește portul 443.",
          "Boolean-based deduce datele analizând diferențele din răspunsul paginii (True vs False), în timp ce Time-based măsoară întârzierea serverului (SLEEP / BENCHMARK).",
          "Time-based funcționează doar noaptea.",
          "Boolean-based cere obligatoriu drepturi de administrator (DBA)."
        ],
        correct: 1,
        explanation: "În Blind SQLi nu se afișează erori sau date pe ecran. În Boolean-based testăm caracter cu caracter (ex: SUBSTRING(pass,1,1)='a') și verificăm dacă pagina afișează 'User exists'. În Time-based forțăm serverul să execute SLEEP(5) dacă predicatul este adevărat."
      }
    ];

    function App() {
      const [examMode, setExamMode] = useState("all"); // "quick10", "sim20", "all"
      const [currentQIdx, setCurrentQIdx] = useState(0);
      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [isFinished, setIsFinished] = useState(false);
      const [timeLeft, setTimeLeft] = useState(45 * 60);

      // Filtered questions based on selected mode
      const activeQuestions = useMemo(() => {
        if (examMode === "quick10") return ALL_EXAM_QUESTIONS.slice(0, 10);
        if (examMode === "sim20") return ALL_EXAM_QUESTIONS.slice(0, 20);
        return ALL_EXAM_QUESTIONS;
      }, [examMode]);

      useEffect(() => {
        if (isFinished || timeLeft <= 0) return;
        const timer = setInterval(() => setTimeLeft(t => t - 1), 1000);
        return () => clearInterval(timer);
      }, [isFinished, timeLeft]);

      const q = activeQuestions[currentQIdx] || activeQuestions[0];
      const answeredCount = Object.keys(selectedAnswers).length;

      const handleSelect = (idx) => {
        if (isFinished) return;
        setSelectedAnswers({ ...selectedAnswers, [currentQIdx]: idx });
      };

      const calculateScore = () => {
        let correct = 0;
        activeQuestions.forEach((quest, idx) => {
          if (selectedAnswers[idx] === quest.correct) correct++;
        });
        return correct;
      };

      const score = calculateScore();
      const rawGrade = (score / activeQuestions.length) * 10;
      const finalGrade = Math.max(1, Math.round(rawGrade * 10) / 10);

      const resetExam = (mode = examMode) => {
        setExamMode(mode);
        setSelectedAnswers({});
        setIsFinished(false);
        setCurrentQIdx(0);
        const durations = { quick10: 15 * 60, sim20: 30 * 60, all: 45 * 60 };
        setTimeLeft(durations[mode] || 45 * 60);
      };

      return (
        <div className="flex-1 flex flex-col justify-between max-w-5xl w-full mx-auto px-4 py-6 sm:px-6 lg:px-8">
          
          {/* Header */}
          <header className="mb-6 pb-4 border-b border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <nav className="flex items-center space-x-2 text-sm text-slate-400 font-medium">
              <a href="../../../index.html" className="hover:text-white transition-colors">ExamTrainers</a>
              <span className="text-slate-600">/</span>
              <a href="../index.html" className="hover:text-white transition-colors">Securitatea Datelor</a>
              <span className="text-slate-600">/</span>
              <span className="text-purple-400 font-bold bg-purple-500/10 px-2.5 py-0.5 rounded border border-purple-500/20 font-mono">
                Mock Exam Simulator
              </span>
            </nav>

            <a href="theory.html" className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-purple-500/40 text-xs font-bold text-slate-300 transition-all">
              <span>📋</span>
              <span>Cele 15 Porunci ale Examenului</span>
            </a>
          </header>

          {/* Mode Switcher */}
          {!isFinished && (
            <div className="flex flex-wrap gap-2 mb-6 p-2 bg-slate-900/80 border border-slate-800 rounded-2xl">
              <span className="text-xs font-bold text-slate-400 self-center px-2 font-mono">Mod Examen:</span>
              <button
                onClick={() => resetExam("quick10")}
                className={`px-3 py-1.5 text-xs font-bold rounded-xl transition-all ${examMode === "quick10" ? "bg-purple-600 text-white shadow-md shadow-purple-600/20" : "bg-slate-950 text-slate-400 hover:text-white"}`}
              >
                Test Rapid (10 Întrebări)
              </button>
              <button
                onClick={() => resetExam("sim20")}
                className={`px-3 py-1.5 text-xs font-bold rounded-xl transition-all ${examMode === "sim20" ? "bg-purple-600 text-white shadow-md shadow-purple-600/20" : "bg-slate-950 text-slate-400 hover:text-white"}`}
              >
                Simulare Examen (20 Întrebări)
              </button>
              <button
                onClick={() => resetExam("all")}
                className={`px-3 py-1.5 text-xs font-bold rounded-xl transition-all ${examMode === "all" ? "bg-purple-600 text-white shadow-md shadow-purple-600/20" : "bg-slate-950 text-slate-400 hover:text-white"}`}
              >
                Maraton Complet (30 Întrebări)
              </button>
            </div>
          )}

          {/* Status Bar */}
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 p-5 bg-slate-900/70 border border-slate-800 rounded-3xl backdrop-blur-xl mb-6">
            <div className="flex items-center gap-3">
              <span className="text-xs font-bold uppercase tracking-wider text-purple-400 font-mono">
                Întrebarea {currentQIdx + 1} din {activeQuestions.length}
              </span>
              <span className="text-xs text-slate-500 font-mono">
                ({answeredCount} rezolvate)
              </span>
            </div>

            <div className="flex items-center gap-4">
              <div className="flex items-center gap-2 font-mono text-xs font-bold text-white bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800">
                <span className="text-purple-400">⏱️</span>
                <span>{Math.floor(timeLeft / 60)}:{String(timeLeft % 60).padStart(2, '0')}</span>
              </div>
              {!isFinished && (
                <button
                  onClick={() => setIsFinished(true)}
                  className="px-4 py-1.5 bg-purple-600 hover:bg-purple-500 text-xs font-bold text-white rounded-xl transition-all shadow-md shadow-purple-600/20"
                >
                  Finalizează Examenul
                </button>
              )}
            </div>
          </div>

          {!isFinished ? (
            <div className="p-8 bg-slate-900/60 border border-slate-800 rounded-3xl backdrop-blur-xl space-y-6">
              <div>
                <span className="inline-block text-[10px] font-bold uppercase tracking-widest text-purple-400 bg-purple-500/10 px-2.5 py-1 rounded-md border border-purple-500/20 mb-3">
                  {q.category}
                </span>
                <h3 className="text-lg sm:text-xl font-bold text-white leading-relaxed">
                  {q.question}
                </h3>
              </div>

              <div className="space-y-3">
                {q.options.map((opt, optIdx) => {
                  const isSelected = selectedAnswers[currentQIdx] === optIdx;
                  return (
                    <button
                      key={optIdx}
                      onClick={() => handleSelect(optIdx)}
                      className={`w-full text-left p-4 rounded-2xl border text-xs sm:text-sm font-medium transition-all duration-150 flex items-start gap-3 ${
                        isSelected
                          ? 'bg-purple-500/15 border-purple-500 text-white shadow-lg shadow-purple-500/10'
                          : 'bg-slate-950/60 border-slate-800 text-slate-300 hover:border-slate-700 hover:bg-slate-950'
                      }`}
                    >
                      <span className={`flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold font-mono ${
                        isSelected ? 'bg-purple-500 text-white' : 'bg-slate-800 text-slate-400'
                      }`}>
                        {String.fromCharCode(65 + optIdx)}
                      </span>
                      <span className="pt-0.5">{opt}</span>
                    </button>
                  );
                })}
              </div>

              <div className="flex items-center justify-between pt-4 border-t border-slate-800/80">
                <button
                  disabled={currentQIdx === 0}
                  onClick={() => setCurrentQIdx(c => c - 1)}
                  className="px-4 py-2 bg-slate-950 hover:bg-slate-800 disabled:opacity-30 text-xs font-bold text-slate-300 rounded-xl transition-all"
                >
                  ← Anterioara
                </button>
                <button
                  disabled={currentQIdx === activeQuestions.length - 1}
                  onClick={() => setCurrentQIdx(c => c + 1)}
                  className="px-4 py-2 bg-slate-950 hover:bg-slate-800 disabled:opacity-30 text-xs font-bold text-slate-300 rounded-xl transition-all"
                >
                  Următoarea →
                </button>
              </div>
            </div>
          ) : (
            <div className="p-8 bg-slate-900/60 border border-slate-800 rounded-3xl backdrop-blur-xl space-y-8">
              <div className="text-center space-y-2">
                <div className="text-xs font-bold uppercase tracking-widest text-slate-400">Raport Oficial de Evaluare &bull; Examen SD</div>
                <h2 className="text-4xl sm:text-5xl font-black text-white">
                  Nota {finalGrade.toFixed(1)} / 10
                </h2>
                <p className="text-sm font-medium text-slate-400">
                  Ai răspuns corect la <strong className="text-emerald-400">{score}</strong> din {activeQuestions.length} întrebări ({Math.round((score / activeQuestions.length) * 100)}%).
                </p>
                <div className="pt-2">
                  {finalGrade >= 9 ? (
                    <span className="inline-flex px-3 py-1 bg-emerald-500/20 text-emerald-300 text-xs font-bold rounded-full border border-emerald-500/30">
                      🏆 Nivel Excelent: Ești pregătit complet pentru nota 10 la examen!
                    </span>
                  ) : finalGrade >= 5 ? (
                    <span className="inline-flex px-3 py-1 bg-indigo-500/20 text-indigo-300 text-xs font-bold rounded-full border border-indigo-500/30">
                      ✅ Nivel Admis: Ai promovat, dar revizuiește capcanele marcate cu roșu mai jos.
                    </span>
                  ) : (
                    <span className="inline-flex px-3 py-1 bg-rose-500/20 text-rose-300 text-xs font-bold rounded-full border border-rose-500/30">
                      🚨 Nivel Sub Punctaj: Recitește tratatul de 22 de pagini și ghidurile teoretice!
                    </span>
                  )}
                </div>
              </div>

              <div className="space-y-4">
                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300">Revizuirea Răspunsurilor & Explicații Pas-cu-Pas:</h3>
                {activeQuestions.map((quest, idx) => {
                  const userAns = selectedAnswers[idx];
                  const isCorrect = userAns === quest.correct;

                  return (
                    <div key={idx} className={`p-5 rounded-2xl border text-xs space-y-2 ${
                      isCorrect ? 'bg-emerald-950/20 border-emerald-500/40' : 'bg-rose-950/20 border-rose-500/40'
                    }`}>
                      <div className="flex items-center justify-between font-bold">
                        <span className="text-slate-300">#{idx + 1}: {quest.question}</span>
                        <span className={isCorrect ? 'text-emerald-400' : 'text-rose-400'}>
                          {isCorrect ? '✓ Corect' : '✗ Greșit'}
                        </span>
                      </div>
                      <div className="text-slate-400">
                        Răspunsul tău: <strong className={isCorrect ? 'text-emerald-300' : 'text-rose-300'}>
                          {userAns !== undefined ? quest.options[userAns] : 'Niciun răspuns selectat'}
                        </strong>
                      </div>
                      {!isCorrect && (
                        <div className="text-emerald-400">
                          Răspuns corect: <strong>{quest.options[quest.correct]}</strong>
                        </div>
                      )}
                      <div className="p-3 bg-slate-950 rounded-xl text-slate-300 leading-relaxed font-mono text-[11px]">
                        💡 <strong>Justificare:</strong> {quest.explanation}
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="text-center pt-4">
                <button
                  onClick={() => resetExam(examMode)}
                  className="px-6 py-3 bg-purple-600 hover:bg-purple-500 text-xs font-bold text-white rounded-2xl transition-all shadow-lg shadow-purple-600/30"
                >
                  Reia Examenul
                </button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-12 py-6 border-t border-slate-800 text-center text-xs text-slate-500">
            &copy; 2026 ExamTrainers • Securitatea Datelor CR4.1 (UCV)
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
