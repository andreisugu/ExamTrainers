<body class="circuit-grid min-h-full font-sans text-slate-200 overflow-x-hidden selection:bg-purple-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // LR(1) Canonical States for Dragon Book / Brezovan Grammar:
    // S -> C C, C -> c C | d
    const BREZOVAN_LR1_STATES = [
      { id: "I0", core: ["S' -> • S", "S -> • C C", "C -> • c C", "C -> • d"], lookahead: "$", mergedInto: "I0" },
      { id: "I1", core: ["S' -> S •"], lookahead: "$", mergedInto: "I1" },
      { id: "I2", core: ["S -> C • C", "C -> • c C", "C -> • d"], lookahead: "$", mergedInto: "I2" },
      { id: "I3", core: ["C -> c • C", "C -> • c C", "C -> • d"], lookahead: "c, d", mergedInto: "I36" },
      { id: "I4", core: ["C -> d •"], lookahead: "c, d", mergedInto: "I47" },
      { id: "I5", core: ["S -> C C •"], lookahead: "$", mergedInto: "I5" },
      { id: "I6", core: ["C -> c • C", "C -> • c C", "C -> • d"], lookahead: "$", mergedInto: "I36" },
      { id: "I7", core: ["C -> d •"], lookahead: "$", mergedInto: "I47" },
      { id: "I8", core: ["C -> c C •"], lookahead: "c, d", mergedInto: "I89" },
      { id: "I9", core: ["C -> c C •"], lookahead: "$", mergedInto: "I89" }
    ];

    // Merged LALR(1) States:
    const LALR_MERGED_STATES = [
      { id: "I0", sources: ["I0"], core: "S' -> • S, S -> • C C, C -> • c C, C -> • d", lookahead: "$" },
      { id: "I1", sources: ["I1"], core: "S' -> S •", lookahead: "$" },
      { id: "I2", sources: ["I2"], core: "S -> C • C, C -> • c C, C -> • d", lookahead: "$" },
      { id: "I36", sources: ["I3", "I6"], core: "C -> c • C, C -> • c C, C -> • d", lookahead: "c, d, $" },
      { id: "I47", sources: ["I4", "I7"], core: "C -> d •", lookahead: "c, d, $" },
      { id: "I5", sources: ["I5"], core: "S -> C C •", lookahead: "$" },
      { id: "I89", sources: ["I8", "I9"], core: "C -> c C •", lookahead: "c, d, $" }
    ];

    // Simulated Shift-Reduce execution on "c d d $"
    const SHIFT_REDUCE_TRACE = [
      { step: 1, stateStack: [0], symbolStack: ["$"], input: "c d d $", action: "Shift &rarr; Starea 36" },
      { step: 2, stateStack: [0, 36], symbolStack: ["$", "c"], input: "d d $", action: "Shift &rarr; Starea 47" },
      { step: 3, stateStack: [0, 36, 47], symbolStack: ["$", "c", "d"], input: "d $", action: "Reduce prin C &rarr; d (GOTO[36, C] = 89)" },
      { step: 4, stateStack: [0, 36, 89], symbolStack: ["$", "c", "C"], input: "d $", action: "Reduce prin C &rarr; c C (GOTO[0, C] = 2)" },
      { step: 5, stateStack: [0, 2], symbolStack: ["$", "C"], input: "d $", action: "Shift &rarr; Starea 47" },
      { step: 6, stateStack: [0, 2, 47], symbolStack: ["$", "C", "d"], input: "$", action: "Reduce prin C &rarr; d (GOTO[2, C] = 5)" },
      { step: 7, stateStack: [0, 2, 5], symbolStack: ["$", "C", "C"], input: "$", action: "Reduce prin S &rarr; C C (GOTO[0, S] = 1)" },
      { step: 8, stateStack: [0, 1], symbolStack: ["$", "S"], input: "$", action: "ACCEPT: Arbore recunoscut cu succes!" }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState("lalr_merge"); // lalr_merge | shift_reduce | bison_prec | hierarchy

      // Bison sandbox settings
      const [bisonPrecedenceMode, setBisonPrecedenceMode] = useState("precedence_ok"); // none | precedence_ok

      return (
        <main className="relative mx-auto flex min-h-screen w-full max-w-6xl flex-col px-4 py-8 sm:px-6 lg:px-8 justify-between">
          
          {/* Header */}
          <header className="mb-8 pb-6 border-b border-slate-800 flex flex-wrap items-center justify-between gap-4">
            <nav className="flex items-center space-x-2 text-sm text-slate-400 font-medium">
              <a href="../../../index.html" className="hover:text-white transition-colors">ExamTrainers</a>
              <span className="text-slate-600">/</span>
              <a href="../index.html" className="hover:text-white transition-colors">Proiectarea Translatoarelor</a>
              <span className="text-slate-600">/</span>
              <span className="text-purple-400 font-bold bg-purple-500/10 px-2.5 py-0.5 rounded border border-purple-500/20 font-mono">Capitolul 3: Bottom-Up LR & Bison</span>
            </nav>

            <div className="flex items-center gap-3">
              <a href="theory.html" className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-xs font-semibold text-slate-200 transition-all">
                <span>📖</span>
                <span>Ghid Teoretic</span>
              </a>
              <a href="../index.html" className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-800 bg-slate-900/60 hover:bg-slate-800 text-xs font-semibold text-slate-400 hover:text-white transition-all">
                <span>&larr;</span>
                <span>Dashboard PT</span>
              </a>
            </div>
          </header>

          {/* Title Area */}
          <section className="mb-8">
            <h1 className="text-3xl sm:text-4xl font-black tracking-tight text-white flex items-center gap-3">
              <span className="p-2 rounded-2xl bg-purple-500/10 border border-purple-500/20 text-purple-400">
                🔄
              </span>
              Laboratorul Bottom-Up LR, Fuziune LALR & Bison
            </h1>
            <p className="text-sm text-slate-400 mt-2 max-w-3xl leading-relaxed">
              Fuziunea nucleelor canonice în LALR(1) pe gramatica Brezovan, trasarea stivei Shift-Reduce, rezolvarea conflictelor prin precedență Bison și verificarea incluziunii claselor de gramatici.
            </p>
          </section>

          {/* Navigation Tabs */}
          <div className="flex flex-wrap gap-2 border-b border-slate-800 pb-4 mb-8">
            <button
              onClick={() => setActiveTab("lalr_merge")}
              className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                activeTab === "lalr_merge"
                  ? "bg-purple-600 text-white shadow-lg shadow-purple-600/30"
                  : "bg-slate-900/80 text-slate-400 hover:text-white border border-slate-800"
              }`}
            >
              1. Fuziunea Nucleelor LALR(1) (Brezovan)
            </button>
            <button
              onClick={() => setActiveTab("shift_reduce")}
              className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                activeTab === "shift_reduce"
                  ? "bg-purple-600 text-white shadow-lg shadow-purple-600/30"
                  : "bg-slate-900/80 text-slate-400 hover:text-white border border-slate-800"
              }`}
            >
              2. Simulator Stivă Shift-Reduce
            </button>
            <button
              onClick={() => setActiveTab("bison_prec")}
              className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                activeTab === "bison_prec"
                  ? "bg-purple-600 text-white shadow-lg shadow-purple-600/30"
                  : "bg-slate-900/80 text-slate-400 hover:text-white border border-slate-800"
              }`}
            >
              3. Sandbox Precedență & Conflicte Bison
            </button>
            <button
              onClick={() => setActiveTab("hierarchy")}
              className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                activeTab === "hierarchy"
                  ? "bg-purple-600 text-white shadow-lg shadow-purple-600/30"
                  : "bg-slate-900/80 text-slate-400 hover:text-white border border-slate-800"
              }`}
            >
              4. Ierarhia Claselor de Gramatici
            </button>
          </div>

          {/* TAB 1: LALR Core Merging */}
          {activeTab === "lalr_merge" && (
            <div className="space-y-6">
              {/* Theory Summary Banner */}
              <div className="p-6 bg-slate-900/60 border border-slate-800 rounded-3xl space-y-3">
                <h3 className="text-base font-bold text-white font-mono flex items-center gap-2">
                  <span>🎯</span> Studiul Canonic de Examen: Gramatica S &rarr; C C, C &rarr; c C | d
                </h3>
                <p className="text-xs text-slate-300 leading-relaxed">
                  În colecția canonică LR(1) apar 10 stări. Observă cum stările cu nuclee identice sunt comasate în LALR(1), reunind simbolurile de anticipare disjuncte:
                </p>
                <div className="grid sm:grid-cols-3 gap-3 font-mono text-xs">
                  <div className="p-3 bg-purple-950/40 border border-purple-500/30 rounded-xl">
                    <span className="text-purple-300 font-bold block">I3 &cup; I6 &rArr; I36</span>
                    <span className="text-slate-400 text-[11px]">&#123;c, d&#125; &cup; &#123;$&#125; = &#123;c, d, $&#125;</span>
                  </div>
                  <div className="p-3 bg-purple-950/40 border border-purple-500/30 rounded-xl">
                    <span className="text-purple-300 font-bold block">I4 &cup; I7 &rArr; I47</span>
                    <span className="text-slate-400 text-[11px]">&#123;c, d&#125; &cup; &#123;$&#125; = &#123;c, d, $&#125;</span>
                  </div>
                  <div className="p-3 bg-purple-950/40 border border-purple-500/30 rounded-xl">
                    <span className="text-purple-300 font-bold block">I8 &cup; I9 &rArr; I89</span>
                    <span className="text-slate-400 text-[11px]">&#123;c, d&#125; &cup; &#123;$&#125; = &#123;c, d, $&#125;</span>
                  </div>
                </div>
              </div>

              {/* Merged LALR States Table */}
              <div className="p-6 bg-slate-900/60 border border-slate-800 rounded-3xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white flex items-center gap-2">
                    <span className="w-6 h-6 rounded-lg bg-purple-500/20 text-purple-400 flex items-center justify-center text-xs font-mono">L</span>
                    Stările Rezultate în Parserul LALR(1) (7 Stări Finale)
                  </h3>
                  <span className="px-3 py-1 rounded-full text-xs font-mono font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                    Reducere: 10 &rarr; 7 Stări (0 Conflicte)
                  </span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs font-mono border-collapse">
                    <thead>
                      <tr className="border-b border-slate-800 bg-slate-950 text-slate-400">
                        <th className="p-3 w-28">Stare LALR</th>
                        <th className="p-3 w-28 text-cyan-400">Origine LR(1)</th>
                        <th className="p-3">Nucleu Gramatical (Core)</th>
                        <th className="p-3 text-right text-purple-300">Lookaheads Reuniți</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {LALR_MERGED_STATES.map((s) => (
                        <tr key={s.id} className="hover:bg-slate-800/30 transition-colors">
                          <td className="p-3 font-bold text-white flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-purple-400"></span>
                            {s.id}
                          </td>
                          <td className="p-3 text-cyan-300 font-semibold">
                            {s.sources.join(" + ")}
                          </td>
                          <td className="p-3 text-slate-300">
                            {s.core}
                          </td>
                          <td className="p-3 text-right font-bold text-purple-300">
                            &#123; {s.lookahead} &#125;
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="p-4 bg-emerald-950/20 border border-emerald-500/30 rounded-2xl text-xs text-emerald-200">
                  <strong className="text-emerald-400 block font-mono mb-1">Demonstrație Teoretică Validată:</strong>
                  Deoarece stările fuzionate (3+6, 4+7, 8+9) aveau nuclee strict identice, tranzițiile de Shift nu au fost modificate în niciun fel. Iar deoarece lookahead-urile reunite nu au suprapus producții diferite de reducere, <strong>nu a apărut niciun conflict Reduce/Reduce</strong>!
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: Shift-Reduce Simulator */}
          {activeTab === "shift_reduce" && (
            <div className="space-y-6">
              <div className="p-6 bg-slate-900/60 border border-slate-800 rounded-3xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white flex items-center gap-2">
                    <span className="w-6 h-6 rounded-lg bg-purple-500/20 text-purple-400 flex items-center justify-center text-xs font-mono">▶</span>
                    Trasarea Execuției Shift-Reduce pe Șirul: "c d d $"
                  </h3>
                  <span className="text-xs font-mono text-slate-400">Gramatica Brezovan LALR(1)</span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs font-mono border-collapse">
                    <thead>
                      <tr className="border-b border-slate-800 bg-slate-950 text-slate-400">
                        <th className="p-2.5 w-12">Pas</th>
                        <th className="p-2.5 w-1/4 text-purple-400">Stivă Stări</th>
                        <th className="p-2.5 w-1/4 text-cyan-400">Stivă Simboluri</th>
                        <th className="p-2.5 w-1/5 text-slate-300">Intrare Rămasă</th>
                        <th className="p-2.5 text-right text-emerald-400">Acțiune Shift / Reduce</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {SHIFT_REDUCE_TRACE.map((t) => (
                        <tr key={t.step} className="hover:bg-slate-800/30">
                          <td className="p-2.5 text-slate-500 font-bold">{t.step}</td>
                          <td className="p-2.5 font-bold text-white">
                            [ {t.stateStack.join(" ")} ]
                          </td>
                          <td className="p-2.5 text-cyan-300 font-semibold">
                            {t.symbolStack.join(" ")}
                          </td>
                          <td className="p-2.5 text-slate-300">
                            {t.input}
                          </td>
                          <td className="p-2.5 text-right font-bold text-slate-200" dangerouslySetInnerHTML={{ __html: t.action }} />
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* TAB 3: Bison Conflict & Precedence Playground */}
          {activeTab === "bison_prec" && (
            <div className="space-y-6">
              <div className="p-6 bg-slate-900/60 border border-slate-800 rounded-3xl space-y-4">
                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                  <span className="w-6 h-6 rounded-lg bg-purple-500/20 text-purple-400 flex items-center justify-center text-xs font-mono">⚖️</span>
                  Sandbox Precedență & Asociativitate în GNU Bison
                </h3>
                <p className="text-xs text-slate-400 leading-relaxed">
                  Fie gramatica ambiguă a expresiilor: <code>E &rarr; E + E | E * E | - E | id</code>. Vezi cum directivele de precedență elimină conflictele Shift/Reduce:
                </p>

                <div className="flex gap-3">
                  <button
                    onClick={() => setBisonPrecedenceMode("none")}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                      bisonPrecedenceMode === "none"
                        ? "bg-rose-600 text-white"
                        : "bg-slate-900 text-slate-400 border border-slate-800"
                    }`}
                  >
                    Fără Directive (%left) &rarr; Conflict Shift/Reduce
                  </button>
                  <button
                    onClick={() => setBisonPrecedenceMode("precedence_ok")}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                      bisonPrecedenceMode === "precedence_ok"
                        ? "bg-emerald-600 text-white"
                        : "bg-slate-900 text-slate-400 border border-slate-800"
                    }`}
                  >
                    Cu %left '+' '-' și %left '*' '/' &rarr; Fără Conflicte
                  </button>
                </div>

                {bisonPrecedenceMode === "none" ? (
                  <div className="p-4 bg-rose-950/30 border border-rose-500/40 rounded-2xl text-xs text-rose-300 space-y-2 font-mono">
                    <strong className="text-rose-400 block font-bold">Avertisment Bison: 4 conflicte Shift/Reduce detectate!</strong>
                    <p>
                      La întâlnirea expresiei <code>id + id * id</code>, parserul din starea <code>E + E •</code> cu lookahead <code>*</code> nu știe dacă să reducă <code>+</code> sau să shifteze <code>*</code>.
                      <br />
                      <em>Rezolvarea implicită Bison:</em> Favorizează <strong>SHIFT</strong> (leagă operatorul cel mai apropiat).
                    </p>
                  </div>
                ) : (
                  <div className="p-4 bg-emerald-950/30 border border-emerald-500/40 rounded-2xl text-xs text-emerald-300 space-y-2 font-mono">
                    <strong className="text-emerald-400 block font-bold">Compilare Curată: 0 Conflicte!</strong>
                    <p>
                      Declarația <code>%left '*' '/'</code> având un nivel mai înalt decât <code>%left '+' '-'</code> determină automat acțiunea de <strong>SHIFT</strong> pe <code>*</code> și de <strong>REDUCE</strong> pe <code>+</code>, respectând precedența matematică naturală!
                    </p>
                  </div>
                )}

                <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800 font-mono text-xs">
                  <span className="text-slate-400 block mb-1">Fragment Fișier Bison (.y):</span>
                  <pre className="text-cyan-300">
{`%token NUMBER ID
%left '+' '-'
%left '*' '/'
%right '^'
%right UMINUS

%%
expr:
    expr '+' expr          { $$ = $1 + $3; }
    | expr '*' expr        { $$ = $1 * $3; }
    | '-' expr %prec UMINUS { $$ = -$2; }
    | ID                   { $$ = lookup($1); }
    | NUMBER               { $$ = $1; }
    ;`}
                  </pre>
                </div>
              </div>
            </div>
          )}

          {/* TAB 4: Grammar Class Hierarchy */}
          {activeTab === "hierarchy" && (
            <div className="p-6 bg-slate-900/60 border border-slate-800 rounded-3xl space-y-6">
              <h3 className="text-lg font-bold text-white flex items-center gap-2">
                <span className="w-6 h-6 rounded-lg bg-purple-500/20 text-purple-400 flex items-center justify-center text-xs font-mono">&sube;</span>
                Relațiile de Incluziune din Ierarhia Gramaticilor
              </h3>

              <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 font-mono text-xs">
                <div className="p-4 bg-slate-950 rounded-2xl border border-indigo-500/30">
                  <span className="text-indigo-400 font-bold block mb-1">LL(1)</span>
                  <p className="text-slate-400">Top-down predictiv cu 1 lookahead. Fără recursivitate la stânga, factorizat.</p>
                </div>
                <div className="p-4 bg-slate-950 rounded-2xl border border-cyan-500/30">
                  <span className="text-cyan-400 font-bold block mb-1">SLR(1)</span>
                  <p className="text-slate-400">Bottom-up pe item-uri LR(0), reduceri ghidate de mulțimea FOLLOW(A).</p>
                </div>
                <div className="p-4 bg-slate-950 rounded-2xl border border-purple-500/30">
                  <span className="text-purple-400 font-bold block mb-1">LALR(1)</span>
                  <p className="text-slate-400">Fuziunea stărilor LR(1) cu același nucleu. Baza parserelor Yacc & Bison.</p>
                </div>
                <div className="p-4 bg-slate-950 rounded-2xl border border-emerald-500/30">
                  <span className="text-emerald-400 font-bold block mb-1">LR(1) Canonic</span>
                  <p className="text-slate-400">Cea mai puternică clasă de gramatici deterministe. Tabele mari de stări.</p>
                </div>
              </div>

              <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800 text-xs text-slate-300 leading-relaxed font-mono">
                <strong className="text-purple-400 block mb-2 text-sm">Relațiile Adevărate de Examen:</strong>
                <p>1. <code>LL(1) &cap; SLR(1) &ne; &empty;</code> (sunt două clase incomparabile direct, niciuna nu este inclusă în cealaltă).</p>
                <p>2. Ambele sunt <strong>submulțimi stricte ale lui LALR(1)</strong>.</p>
                <p>3. <code>LALR(1) &sub; LR(1) &sub; CFG</code>.</p>
              </div>
            </div>
          )}
