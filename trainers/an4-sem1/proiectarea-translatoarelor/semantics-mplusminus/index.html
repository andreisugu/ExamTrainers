<!DOCTYPE html>
<html lang="ro" class="h-full scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio: Semantică Statică, AST & Proiectul M+- - Exam Trainers</title>
  <meta name="description" content="Studio interactiv pentru Proiectarea Translatoarelor: Scoped Symbol Table cu name shadowing, validator de tipuri M+-, generator 3AC și analiză de flux DEF/USE.">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          boxShadow: {
            'glow-emerald': '0 0 25px -5px rgba(16, 185, 129, 0.4)',
          }
        }
      }
    };
  </script>

  <style>
    body {
      background: 
        radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 45%),
        #090d16;
    }

    .circuit-grid {
      background-size: 36px 36px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }
  </style>
</head>
<body class="circuit-grid min-h-full font-sans text-slate-200 overflow-x-hidden selection:bg-emerald-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Official Code Samples from Cd_ProjMPlusMinus.pdf
    const OFFICIAL_CODE_SAMPLES = {
      matrix_m: {
        title: "Multiplicare Matrice (matrix.m - Caiet Proiect)",
        code: `fun mult_matrix(a[][]:real, b[][]:real, c[][]:real):bool {
  var ab[size(a)][size(b[])]:real;
  var n:int; var m:int; var p:int; var i:int; var j:int; var k:int;
  var ret:bool;
  begin
    n := size(a); m := size(b); p := size(c[]);
    if n = size(c) && m = size(a[]) && p = size(b[]) then {
      begin
        i := 0;
        while i < n do {
          begin
            j := 0;
            while j < p do {
              begin
                ab[i][j] := 0.0;
                k := 0;
                while k < m do {
                  begin
                    ab[i][j] := ab[i][j] + a[i][k] * b[k][j];
                    k := k + 1;
                  end
                };
                j := j + 1;
              end
            };
            i := i + 1;
          end
        };
        ret := true;
      end
    } else ret := false;
    return ret;
  end
};`,
        explanation: "Demonstrează tablouri dinamice cu dimensiuni dependente de argumente (size(a)), pasare prin referință (a[][]:real) și bucle WHILE imbricate."
      },
      sumarray_m: {
        title: "Sumare Tablou Dinamic (sumarray.m)",
        code: `fun sum_list(N:int):real {
  var X[N]:real;
  fun read_list(X[]:real):bool {
    var i:int;
    begin
      i := 0;
      while i < size(X) do {
        begin read X[i]; i := i + 1; end
      };
      return true;
    end
  };
  var x:real;
  begin
    print read_list(X);
    return 0.0;
  end
};`,
        explanation: "Ilustrează definirea funcțiilor locale imbricate în interiorul altei funcții și transmiterea prin referință a tablourilor."
      },
      type_traps: {
        title: "Capcane Frecvente de Tip (Erori Semantice)",
        code: `var a:int; var b:int; var flag:bool;
begin
  % Eroare 1: WHILE cere strict BOOL (1 este INT)
  while 1 do { a := a - 1; };

  % Eroare 2: Adunare incompatibila intre BOOL si INT
  a := flag + b;

  % Corect: Expresie relationala ce produce BOOL
  while a > 0 do { a := a - 1; };
end`,
        explanation: "În M+-, WHILE 1 DO produce o eroare semantică fatală! Sistemul de tipuri este strict și interzice conversia întregilor la booleeni."
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState("symbol_table"); // symbol_table | type_checker | three_ac | sdd_dag

      // Scoped Symbol Table State
      const [scopes, setScopes] = useState([
        {
          id: 0,
          name: "Global Scope (Nivel 0)",
          symbols: [
            { name: "n", type: "INT", category: "VAR", offset: 0 },
            { name: "pi", type: "REAL", category: "VAR", offset: 4 },
            { name: "mult_matrix", type: "BOOL", category: "FUN", offset: 12 }
          ]
        },
        {
          id: 1,
          name: "Local Scope: mult_matrix (Nivel 1)",
          symbols: [
            { name: "n", type: "INT", category: "VAR (Shadow)", offset: 0 },
            { name: "ab", type: "REAL[][]", category: "ARRAY", offset: 4 },
            { name: "ret", type: "BOOL", category: "VAR", offset: 20 }
          ]
        }
      ]);
      const [lookupQuery, setLookupQuery] = useState("n");
      const [lookupResult, setLookupResult] = useState(null);

      // Scoped Lookup Function
      const handleLookup = () => {
        let q = lookupQuery.trim();
        if (!q) return;

        // search top scope first down to 0
        for (let i = scopes.length - 1; i >= 0; i--) {
          let found = scopes[i].symbols.find(s => s.name === q || s.name.startsWith(q + " "));
          if (found) {
            setLookupResult({
              found: true,
              symbol: found,
              scopeName: scopes[i].name,
              level: i,
              isShadowed: i > 0 && scopes[0].symbols.some(s => s.name === q)
            });
            return;
          }
        }

        setLookupResult({
          found: false,
          name: q
        });
      };

      // Add Scope
      const enterScope = () => {
        let newId = scopes.length;
        setScopes([...scopes, {
          id: newId,
          name: `Bloc Imbricat #{...} (Nivel ${newId})`,
          symbols: []
        }]);
      };

      // Exit Scope
      const exitScope = () => {
        if (scopes.length <= 1) return;
        setScopes(scopes.slice(0, scopes.length - 1));
        setLookupResult(null);
      };

      // Type Checker Selected Sample
      const [selectedSampleKey, setSelectedSampleKey] = useState("type_traps");
      const currentSample = OFFICIAL_CODE_SAMPLES[selectedSampleKey];

      return (
        <main className="relative mx-auto flex min-h-screen w-full max-w-6xl flex-col px-4 py-8 sm:px-6 lg:px-8 justify-between">
          
          {/* Header */}
          <header className="mb-8 pb-6 border-b border-slate-800 flex flex-wrap items-center justify-between gap-4">
            <nav className="flex items-center space-x-2 text-sm text-slate-400 font-medium">
              <a href="../../../index.html" className="hover:text-white transition-colors">ExamTrainers</a>
              <span className="text-slate-600">/</span>
              <a href="../index.html" className="hover:text-white transition-colors">Proiectarea Translatoarelor</a>
              <span className="text-slate-600">/</span>
              <span className="text-emerald-400 font-bold bg-emerald-500/10 px-2.5 py-0.5 rounded border border-emerald-500/20 font-mono">Capitolul 4: Semantică Statică & M+-</span>
            </nav>

            <div className="flex items-center gap-3">
              <a href="theory.html" className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-xs font-semibold text-slate-200 transition-all">
                <span>📖</span>
                <span>Ghid Teoretic</span>
              </a>
              <a href="../index.html" className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-800 bg-slate-900/60 hover:bg-slate-800 text-xs font-semibold text-slate-400 hover:text-white transition-all">
                <span>&larr;</span>
                <span>Dashboard PT</span>
              </a>
            </div>
          </header>

          {/* Title Area */}
          <section className="mb-8">
            <h1 className="text-3xl sm:text-4xl font-black tracking-tight text-white flex items-center gap-3">
              <span className="p-2 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400">
                🧬
              </span>
              Studio Semantică, Tabela de Simboluri & Proiectul M<sup>+-</sup>
            </h1>
            <p className="text-sm text-slate-400 mt-2 max-w-3xl leading-relaxed">
              Explorarea domeniilor de vizibilitate cu Name Shadowing, validarea tipurilor pe codul sursă oficial din laborator (matrix.m, sumarray.m) și generarea Codului cu Trei Adrese (3AC) cu analiza de flux DEF/USE.
            </p>
          </section>

          {/* Navigation Tabs */}
          <div className="flex flex-wrap gap-2 border-b border-slate-800 pb-4 mb-8">
            <button
              onClick={() => setActiveTab("symbol_table")}
              className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                activeTab === "symbol_table"
                  ? "bg-emerald-600 text-white shadow-lg shadow-emerald-600/30"
                  : "bg-slate-900/80 text-slate-400 hover:text-white border border-slate-800"
              }`}
            >
              1. Scoped Symbol Table & Shadowing
            </button>
            <button
              onClick={() => setActiveTab("type_checker")}
              className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                activeTab === "type_checker"
                  ? "bg-emerald-600 text-white shadow-lg shadow-emerald-600/30"
                  : "bg-slate-900/80 text-slate-400 hover:text-white border border-slate-800"
              }`}
            >
              2. Validator Semantic de Tipuri M+-
            </button>
            <button
              onClick={() => setActiveTab("three_ac")}
              className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                activeTab === "three_ac"
                  ? "bg-emerald-600 text-white shadow-lg shadow-emerald-600/30"
                  : "bg-slate-900/80 text-slate-400 hover:text-white border border-slate-800"
              }`}
            >
              3. Generator 3AC & Dataflow (DEF/USE)
            </button>
            <button
              onClick={() => setActiveTab("sdd_dag")}
              className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                activeTab === "sdd_dag"
                  ? "bg-emerald-600 text-white shadow-lg shadow-emerald-600/30"
                  : "bg-slate-900/80 text-slate-400 hover:text-white border border-slate-800"
              }`}
            >
              4. Atribute S vs. L & Evaluare SDD
            </button>
          </div>

          {/* TAB 1: Scoped Symbol Table */}
          {activeTab === "symbol_table" && (
            <div className="space-y-6">
              {/* Controls */}
              <div className="p-6 bg-slate-900/60 border border-slate-800 rounded-3xl flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <button
                    onClick={enterScope}
                    className="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white transition-all shadow-md shadow-emerald-600/30"
                  >
                    + enter_scope()
                  </button>
                  <button
                    onClick={exitScope}
                    disabled={scopes.length <= 1}
                    className="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-500 disabled:opacity-40 text-xs font-bold text-white transition-all shadow-md shadow-rose-600/30"
                  >
                    - exit_scope()
                  </button>
                  <span className="text-xs font-mono text-slate-400">
                    Nivel curent adâncime: <strong className="text-emerald-400">{scopes.length - 1}</strong>
                  </span>
                </div>

                <div className="flex items-center gap-2">
                  <input
                    type="text"
                    value={lookupQuery}
                    onChange={(e) => setLookupQuery(e.target.value)}
                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs font-mono text-cyan-300 focus:outline-none focus:border-emerald-500"
                    placeholder="ex: n, ab, pi"
                  />
                  <button
                    onClick={handleLookup}
                    className="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white transition-all shadow-md shadow-indigo-600/30"
                  >
                    lookup()
                  </button>
                </div>
              </div>

              {/* Lookup Result Box */}
              {lookupResult && (
                <div className={`p-4 rounded-2xl border text-xs font-mono ${
                  lookupResult.found 
                    ? "bg-emerald-950/30 border-emerald-500/40 text-emerald-300"
                    : "bg-rose-950/30 border-rose-500/40 text-rose-300"
                }`}>
                  {lookupResult.found ? (
                    <div>
                      <strong className="text-emerald-400 block mb-1">Simbol Găsit cu Succes:</strong>
                      Identificatorul <code>"{lookupResult.symbol.name}"</code> a fost rezolvat în <strong>{lookupResult.scopeName}</strong> (Nivel {lookupResult.level}).
                      {lookupResult.isShadowed && (
                        <p className="text-amber-300 mt-1">
                          ⚠️ <strong>Fenomen de Name Shadowing:</strong> Această variabilă locală maschează declarația omonimă din tabela globală!
                        </p>
                      )}
                    </div>
                  ) : (
                    <div>
                      <strong className="text-rose-400 block mb-1">Eroare Semantică:</strong>
                      Identificatorul <code>"{lookupResult.name}"</code> NU a fost găsit în niciun domeniu de vizibilitate activ (Undeclared Variable Error).
                    </div>
                  )}
                </div>
              )}

              {/* Active Scopes Stack */}
              <div className="space-y-4">
                <h3 className="text-sm font-bold text-white font-mono flex items-center gap-2">
                  <span>📚</span> Stiva Domeniilor de Vizibilitate (De sus în jos):
                </h3>

                <div className="grid gap-4">
                  {[...scopes].reverse().map((sc) => (
                    <div key={sc.id} className="p-4 bg-slate-900/60 border border-slate-800 rounded-2xl space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="font-mono font-bold text-xs text-emerald-400">{sc.name}</span>
                        <span className="text-[10px] text-slate-500 font-mono">Simboluri: {sc.symbols.length}</span>
                      </div>

                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs font-mono border-collapse">
                          <thead>
                            <tr className="border-b border-slate-800 text-slate-500">
                              <th className="p-2">Nume</th>
                              <th className="p-2">Tip de Bază</th>
                              <th className="p-2">Categorie</th>
                              <th className="p-2 text-right">Offset Stivă</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800/40">
                            {sc.symbols.map((sym, sIdx) => (
                              <tr key={sIdx} className="hover:bg-slate-800/30">
                                <td className="p-2 font-bold text-white">{sym.name}</td>
                                <td className="p-2 text-cyan-300">{sym.type}</td>
                                <td className="p-2 text-slate-400">{sym.category}</td>
                                <td className="p-2 text-right text-slate-500">+{sym.offset} B</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: Type Checker M+- */}
          {activeTab === "type_checker" && (
            <div className="space-y-6">
              {/* Presets Toolbar */}
              <div className="p-4 bg-slate-900/60 border border-slate-800 rounded-2xl flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-2">
                  <span className="text-xs font-bold text-slate-400 uppercase font-mono">Program Didactic:</span>
                  <select
                    value={selectedSampleKey}
                    onChange={(e) => setSelectedSampleKey(e.target.value)}
                    className="bg-slate-950 border border-slate-700 text-white rounded-xl px-3 py-1.5 text-xs font-semibold focus:outline-none focus:border-emerald-500"
                  >
                    {Object.entries(OFFICIAL_CODE_SAMPLES).map(([k, s]) => (
                      <option key={k} value={k}>{s.title}</option>
                    ))}
                  </select>
                </div>

                <span className="text-xs font-mono text-emerald-400 font-bold">Limbaj Didactic M+-</span>
              </div>

              {/* Code Viewer & Semantic Diagnosis */}
              <div className="grid md:grid-cols-2 gap-6">
                <div className="p-6 bg-slate-900/60 border border-slate-800 rounded-3xl space-y-3">
                  <h3 className="text-sm font-bold text-white font-mono flex items-center gap-2">
                    <span>📄</span> Cod Sursă M+-:
                  </h3>
                  <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800 font-mono text-xs overflow-x-auto max-h-96 overflow-y-auto">
                    <pre className="text-slate-300 leading-relaxed">{currentSample.code}</pre>
                  </div>
                </div>

                <div className="p-6 bg-slate-900/60 border border-slate-800 rounded-3xl space-y-4">
                  <h3 className="text-sm font-bold text-white font-mono flex items-center gap-2">
                    <span>🔍</span> Diagnostic Semantic & Reguli de Tip:
                  </h3>

                  <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800 text-xs text-slate-300 leading-relaxed font-mono space-y-3">
                    <p className="text-emerald-300">{currentSample.explanation}</p>
                    
                    <div className="border-t border-slate-800 pt-3 space-y-2">
                      <span className="text-cyan-400 font-bold block">Verificări de Tip Aplicate Automat:</span>
                      <p>1. Verificarea expresiei condiționale în WHILE: <code>type(expr) == BOOL</code>.</p>
                      <p>2. Compatibilitatea tipurilor la atribuire: <code>type(id) &larr; type(expr)</code>.</p>
                      <p>3. Coerența dimensiunilor de tablouri la apelurile funcțiilor.</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TAB 3: 3AC & Dataflow */}
          {activeTab === "three_ac" && (
            <div className="space-y-6">
              <div className="p-6 bg-slate-900/60 border border-slate-800 rounded-3xl space-y-4">
                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                  <span className="w-6 h-6 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-mono">3AC</span>
                  Generarea Codului cu Trei Adrese (3-Address Code)
                </h3>
                <p className="text-xs text-slate-400 leading-relaxed">
                  Pentru instrucțiunea: <code>x := a + b * c - d;</code>
                </p>

                <div className="grid md:grid-cols-2 gap-4 font-mono text-xs">
                  <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800">
                    <span className="text-emerald-400 font-bold block mb-2">Instrucțiuni 3AC Liniare:</span>
                    <pre className="text-slate-300 leading-relaxed">
t1 = b * c
t2 = a + t1
t3 = t2 - d
x = t3
                    </pre>
                  </div>

                  <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800">
                    <span className="text-cyan-400 font-bold block mb-2">Reprezentare prin Cvadruple (Quadruples):</span>
                    <pre className="text-slate-300 leading-relaxed">
(1)  *,  b,  c,  t1
(2)  +,  a,  t1, t2
(3)  -,  t2, d,  t3
(4)  :=, t3, -,  x
                    </pre>
                  </div>
                </div>
              </div>

              {/* Dataflow Analysis Sets */}
              <div className="p-6 bg-slate-900/60 border border-slate-800 rounded-3xl space-y-4">
                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                  <span className="w-6 h-6 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-mono">CFG</span>
                  Analiza de Flux pe Blocul de Bază (cf. sld1.pdf slide 19)
                </h3>

                <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 font-mono text-xs">
                  <div className="p-3 bg-slate-950 rounded-xl border border-emerald-500/30">
                    <span className="text-emerald-400 font-bold block mb-1">DEF (Variabile scrise):</span>
                    <p className="text-white font-bold">&#123; t1, t2, t3, x &#125;</p>
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-cyan-500/30">
                    <span className="text-cyan-400 font-bold block mb-1">USE (Variabile citite):</span>
                    <p className="text-white font-bold">&#123; a, b, c, d &#125;</p>
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-indigo-500/30">
                    <span className="text-indigo-400 font-bold block mb-1">GEN (Definiții active):</span>
                    <p className="text-white font-bold">&#123; def(x) &#125;</p>
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-rose-500/30">
                    <span className="text-rose-400 font-bold block mb-1">KILL (Definiții anulate):</span>
                    <p className="text-white font-bold">&#123; def_vechi(x) &#125;</p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TAB 4: SDD DAG */}
          {activeTab === "sdd_dag" && (
            <div className="p-6 bg-slate-900/60 border border-slate-800 rounded-3xl space-y-6">
              <h3 className="text-lg font-bold text-white flex items-center gap-2">
                <span className="w-6 h-6 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-mono">AG</span>
                Clasificarea Atributelor: Sintetizate (S) vs. Moștenite (L)
              </h3>

              <div className="grid md:grid-cols-2 gap-4 font-mono text-xs">
                <div className="p-4 bg-slate-950 rounded-2xl border border-emerald-500/30 space-y-2">
                  <span className="text-emerald-400 font-bold text-sm block">Definiții S-Attributed</span>
                  <p className="text-slate-300">Toate regulile calculează atributele părintelui folosind fiii:</p>
                  <p className="text-cyan-300">E.val = E1.val + T.val</p>
                  <p className="text-slate-400 text-[11px]">Se evaluează printr-o parcurgere post-ordine sau pe stiva Bison în timpul reducerilor.</p>
                </div>

                <div className="p-4 bg-slate-950 rounded-2xl border border-cyan-500/30 space-y-2">
                  <span className="text-cyan-400 font-bold text-sm block">Definiții L-Attributed</span>
                  <p className="text-slate-300">Regulile pot transmite informație de la părinte sau frații din stânga:</p>
                  <p className="text-cyan-300">L.in_type = T.type</p>
                  <p className="text-slate-400 text-[11px]">Se evaluează printr-o parcurgere depth-first de la stânga la dreapta (compatibil cu LL(1)).</p>
                </div>
              </div>

              <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800 text-xs font-mono text-slate-300">
                <strong className="text-emerald-400 block mb-1">Sortare Topologică & DAG:</strong>
                Orice definiție SDD fără dependențe circulare este transpusă într-un DAG de atribute. Ordinea secvențială de execuție a codului de verificare semantică este dată de <strong>sortarea topologică</strong> a nodurilor din graf.
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-12 py-6 border-t border-slate-900 text-center text-xs text-slate-600 font-semibold tracking-wide uppercase">

          </footer>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
