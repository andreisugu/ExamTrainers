<!DOCTYPE html>
<html lang="ro" class="h-full scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workbench: Analiză Top-Down, LL(1) & Coborâre Recursivă - Exam Trainers</title>
  <meta name="description" content="Workbench interactiv pentru Proiectarea Translatoarelor: Calculator FIRST și FOLLOW, tabel LL(1) M[A, a], simulator stivă de parsare și generator C++ coborâre recursivă.">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          boxShadow: {
            'glow-indigo': '0 0 25px -5px rgba(99, 102, 241, 0.4)',
          }
        }
      }
    };
  </script>

  <style>
    body {
      background: 
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 45%),
        #090d16;
    }

    .circuit-grid {
      background-size: 36px 36px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }
  </style>
</head>
<body class="circuit-grid min-h-full font-sans text-slate-200 overflow-x-hidden selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const GRAMMAR_PRESETS = {
      expr_classic: {
        name: "Gramatica Expresiilor LL(1) (Eliminare Recursivitate)",
        nonterminals: ["E", "E'", "T", "T'", "F"],
        terminals: ["id", "+", "*", "(", ")"],
        startSymbol: "E",
        productions: [
          { lhs: "E", rhs: ["T", "E'"] },
          { lhs: "E'", rhs: ["+", "T", "E'"] },
          { lhs: "E'", rhs: ["eps"] },
          { lhs: "T", rhs: ["F", "T'"] },
          { lhs: "T'", rhs: ["*", "F", "T'"] },
          { lhs: "T'", rhs: ["eps"] },
          { lhs: "F", rhs: ["(", "E", ")"] },
          { lhs: "F", rhs: ["id"] }
        ],
        firstSets: {
          "E": ["(", "id"],
          "E'": ["+", "eps"],
          "T": ["(", "id"],
          "T'": ["*", "eps"],
          "F": ["(", "id"]
        },
        followSets: {
          "E": [")", "$"],
          "E'": [")", "$"],
          "T": ["+", ")", "$"],
          "T'": ["+", ")", "$"],
          "F": ["*", "+", ")", "$"]
        },
        defaultInput: "id + id * id $"
      },
      brezovan_eps_trap: {
        name: "Capcana Epsilon Brezovan (S -> A B c)",
        nonterminals: ["S", "A", "B"],
        terminals: ["a", "b", "c"],
        startSymbol: "S",
        productions: [
          { lhs: "S", rhs: ["A", "B", "c"] },
          { lhs: "A", rhs: ["a"] },
          { lhs: "A", rhs: ["eps"] },
          { lhs: "B", rhs: ["b"] },
          { lhs: "B", rhs: ["eps"] }
        ],
        firstSets: {
          "S": ["a", "b", "c"],
          "A": ["a", "eps"],
          "B": ["b", "eps"]
        },
        followSets: {
          "S": ["$"],
          "A": ["b", "c"],
          "B": ["c"]
        },
        defaultInput: "a b c $"
      },
      dangling_factored: {
        name: "Instrucțiunea IF-THEN-ELSE Factorizată",
        nonterminals: ["S", "S'", "E"],
        terminals: ["if", "then", "else", "cond", "other"],
        startSymbol: "S",
        productions: [
          { lhs: "S", rhs: ["if", "E", "then", "S", "S'"] },
          { lhs: "S", rhs: ["other"] },
          { lhs: "S'", rhs: ["else", "S"] },
          { lhs: "S'", rhs: ["eps"] },
          { lhs: "E", rhs: ["cond"] }
        ],
        firstSets: {
          "S": ["if", "other"],
          "S'": ["else", "eps"],
          "E": ["cond"]
        },
        followSets: {
          "S": ["else", "$"],
          "S'": ["else", "$"],
          "E": ["then"]
        },
        defaultInput: "if cond then other $"
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState("first_follow"); // first_follow | table | stack | cpp
      const [selectedKey, setSelectedKey] = useState("expr_classic");
      const currentGrammar = GRAMMAR_PRESETS[selectedKey];

      // LL(1) Table Matrix Computation
      const ll1Table = useMemo(() => {
        let cols = [...currentGrammar.terminals, "$"];
        let matrix = {};
        for (let nt of currentGrammar.nonterminals) {
          matrix[nt] = {};
          for (let c of cols) {
            matrix[nt][c] = [];
          }
        }

        for (let p of currentGrammar.productions) {
          let firstRhs = [];
          let lead = p.rhs[0];
          if (lead === "eps") {
            firstRhs = ["eps"];
          } else if (currentGrammar.terminals.includes(lead)) {
            firstRhs = [lead];
          } else if (currentGrammar.nonterminals.includes(lead)) {
            firstRhs = currentGrammar.firstSets[lead] || [];
          }

          // Rule 1: for each terminal in FIRST(alpha), add A -> alpha to M[A, a]
          for (let sym of firstRhs) {
            if (sym !== "eps" && matrix[p.lhs] && matrix[p.lhs][sym]) {
              matrix[p.lhs][sym].push({ prod: p, reason: "FIRST" });
            }
          }

          // Rule 2: if eps in FIRST(alpha), for each b in FOLLOW(A), add A -> alpha to M[A, b]
          if (firstRhs.includes("eps")) {
            let follows = currentGrammar.followSets[p.lhs] || [];
            for (let b of follows) {
              if (matrix[p.lhs] && matrix[p.lhs][b]) {
                // avoid duplicate entry of same rule
                if (!matrix[p.lhs][b].some(item => item.prod === p)) {
                  matrix[p.lhs][b].push({ prod: p, reason: "FOLLOW_EPS" });
                }
              }
            }
          }
        }

        return { cols, matrix };
      }, [currentGrammar]);

      // Stack Simulation State
      const [stackInput, setStackInput] = useState(currentGrammar.defaultInput);
      const [stepHistory, setStepHistory] = useState([]);
      const [currentStepIdx, setCurrentStepIdx] = useState(0);

      // Function to initialize LL(1) parsing steps
      const initParsing = () => {
        let tokens = stackInput.trim().split(/\s+/);
        if (!tokens.includes("$")) tokens.push("$");

        let stack = ["$", currentGrammar.startSymbol];
        let steps = [{
          stepNum: 1,
          stack: [...stack],
          remaining: [...tokens],
          action: `Inițializare stivă cu [$, ${currentGrammar.startSymbol}]`,
          status: "RUNNING"
        }];

        let limit = 40;
        let iter = 0;
        let success = false;
        let error = false;

        while (stack.length > 0 && tokens.length > 0 && iter < limit) {
          iter++;
          let top = stack[stack.length - 1];
          let lookahead = tokens[0];

          if (top === "$" && lookahead === "$") {
            success = true;
            steps.push({
              stepNum: steps.length + 1,
              stack: ["$"],
              remaining: ["$"],
              action: "ACCEPT: Parsare sintactică realizată cu succes!",
              status: "ACCEPTED"
            });
            break;
          }

          if (top === lookahead) {
            // Match terminal
            stack.pop();
            tokens.shift();
            steps.push({
              stepNum: steps.length + 1,
              stack: [...stack],
              remaining: [...tokens],
              action: `MATCH: Consumat terminalul '${lookahead}'`,
              status: "MATCH"
            });
          } else if (currentGrammar.nonterminals.includes(top)) {
            // Nonterminal expansion via M[top, lookahead]
            let entries = ll1Table.matrix[top]?.[lookahead] || [];
            if (entries.length === 0) {
              error = true;
              steps.push({
                stepNum: steps.length + 1,
                stack: [...stack],
                remaining: [...tokens],
                action: `EROARE SINTACTICĂ: Nicio producție validă în celula M[${top}, '${lookahead}']!`,
                status: "ERROR"
              });
              break;
            } else if (entries.length > 1) {
              error = true;
              steps.push({
                stepNum: steps.length + 1,
                stack: [...stack],
                remaining: [...tokens],
                action: `CONFLICT LL(1): Intrări multiple în celula M[${top}, '${lookahead}']!`,
                status: "ERROR"
              });
              break;
            } else {
              let chosenProd = entries[0].prod;
              stack.pop();
              if (chosenProd.rhs[0] !== "eps") {
                // push rhs in reverse
                for (let i = chosenProd.rhs.length - 1; i >= 0; i--) {
                  stack.push(chosenProd.rhs[i]);
                }
              }
              steps.push({
                stepNum: steps.length + 1,
                stack: [...stack],
                remaining: [...tokens],
                action: `PREDICT: Aplică regula ${chosenProd.lhs} -> ${chosenProd.rhs.join(" ")}`,
                status: "PREDICT"
              });
            }
          } else {
            error = true;
            steps.push({
              stepNum: steps.length + 1,
              stack: [...stack],
              remaining: [...tokens],
              action: `EROARE SINTACTICĂ: Vârf stivă '${top}' incompatibil cu '${lookahead}'!`,
              status: "ERROR"
            });
            break;
          }
        }

        setStepHistory(steps);
        setCurrentStepIdx(0);
      };

      return (
        <main className="relative mx-auto flex min-h-screen w-full max-w-6xl flex-col px-4 py-8 sm:px-6 lg:px-8 justify-between">
          
          {/* Header */}
          <header className="mb-8 pb-6 border-b border-slate-800 flex flex-wrap items-center justify-between gap-4">
            <nav className="flex items-center space-x-2 text-sm text-slate-400 font-medium">
              <a href="../../../index.html" className="hover:text-white transition-colors">ExamTrainers</a>
              <span className="text-slate-600">/</span>
              <a href="../index.html" className="hover:text-white transition-colors">Proiectarea Translatoarelor</a>
              <span className="text-slate-600">/</span>
              <span className="text-indigo-400 font-bold bg-indigo-500/10 px-2.5 py-0.5 rounded border border-indigo-500/20 font-mono">Capitolul 2: Top-Down LL(1)</span>
            </nav>

            <div className="flex items-center gap-3">
              <a href="theory.html" className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-xs font-semibold text-slate-200 transition-all">
                <span>📖</span>
                <span>Ghid Teoretic</span>
              </a>
              <a href="../index.html" className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-800 bg-slate-900/60 hover:bg-slate-800 text-xs font-semibold text-slate-400 hover:text-white transition-all">
                <span>&larr;</span>
                <span>Dashboard PT</span>
              </a>
            </div>
          </header>

          {/* Title Area */}
          <section className="mb-8">
            <h1 className="text-3xl sm:text-4xl font-black tracking-tight text-white flex items-center gap-3">
              <span className="p-2 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400">
                ⚡
              </span>
              Workbench Analiză Top-Down LL(1) & Stivă
            </h1>
            <p className="text-sm text-slate-400 mt-2 max-w-3xl leading-relaxed">
              Calculul formal al mulțimilor FIRST și FOLLOW, construirea automată a tabelului predictiv M[A, a], detectarea conflictelor și simularea vizuală a stivei de parsare.
            </p>
          </section>

          {/* Preset Selector */}
          <div className="p-4 bg-slate-900/60 border border-slate-800 rounded-2xl mb-8 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center gap-2">
              <span className="text-xs font-bold text-slate-400 uppercase font-mono">Preset Gramatică:</span>
              <select
                value={selectedKey}
                onChange={(e) => {
                  setSelectedKey(e.target.value);
                  setStackInput(GRAMMAR_PRESETS[e.target.value].defaultInput);
                  setStepHistory([]);
                }}
                className="bg-slate-950 border border-slate-700 text-white rounded-xl px-3 py-1.5 text-xs font-semibold focus:outline-none focus:border-indigo-500"
              >
                {Object.entries(GRAMMAR_PRESETS).map(([k, g]) => (
                  <option key={k} value={k}>{g.name}</option>
                ))}
              </select>
            </div>

            <div className="flex items-center gap-3 text-xs font-mono text-slate-400">
              <span>Start: <strong className="text-indigo-400">{currentGrammar.startSymbol}</strong></span>
              <span>&bull;</span>
              <span>Neterminale: <strong className="text-cyan-400">{currentGrammar.nonterminals.join(", ")}</strong></span>
            </div>
          </div>

          {/* Navigation Tabs */}
          <div className="flex flex-wrap gap-2 border-b border-slate-800 pb-4 mb-8">
            <button
              onClick={() => setActiveTab("first_follow")}
              className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                activeTab === "first_follow"
                  ? "bg-indigo-600 text-white shadow-lg shadow-indigo-600/30"
                  : "bg-slate-900/80 text-slate-400 hover:text-white border border-slate-800"
              }`}
            >
              1. Mulțimile FIRST & FOLLOW
            </button>
            <button
              onClick={() => setActiveTab("table")}
              className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                activeTab === "table"
                  ? "bg-indigo-600 text-white shadow-lg shadow-indigo-600/30"
                  : "bg-slate-900/80 text-slate-400 hover:text-white border border-slate-800"
              }`}
            >
              2. Tabelul Matricial LL(1) M[A, a]
            </button>
            <button
              onClick={() => setActiveTab("stack")}
              className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                activeTab === "stack"
                  ? "bg-indigo-600 text-white shadow-lg shadow-indigo-600/30"
                  : "bg-slate-900/80 text-slate-400 hover:text-white border border-slate-800"
              }`}
            >
              3. Simulator Stivă LL(1)
            </button>
            <button
              onClick={() => setActiveTab("cpp")}
              className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                activeTab === "cpp"
                  ? "bg-indigo-600 text-white shadow-lg shadow-indigo-600/30"
                  : "bg-slate-900/80 text-slate-400 hover:text-white border border-slate-800"
              }`}
            >
              4. Generator Cod Coborâre Recursivă C++
            </button>
          </div>

          {/* TAB 1: FIRST & FOLLOW */}
          {activeTab === "first_follow" && (
            <div className="space-y-6">
              {/* Grammar Rules Display */}
              <div className="p-6 bg-slate-900/60 border border-slate-800 rounded-3xl space-y-3">
                <h3 className="text-base font-bold text-white font-mono flex items-center gap-2">
                  <span>📜</span> Producțiile Gramaticale Active:
                </h3>
                <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-2 font-mono text-xs">
                  {currentGrammar.productions.map((p, idx) => (
                    <div key={idx} className="p-2.5 bg-slate-950 rounded-xl border border-slate-800 text-slate-300">
                      <span className="text-indigo-400 font-bold">{p.lhs}</span> &rarr; {p.rhs.join(" ")}
                    </div>
                  ))}
                </div>
              </div>

              {/* FIRST & FOLLOW Result Table */}
              <div className="p-6 bg-slate-900/60 border border-slate-800 rounded-3xl space-y-4">
                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                  <span className="w-6 h-6 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xs font-mono">✓</span>
                  Tabelul Comparativ FIRST & FOLLOW
                </h3>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs font-mono border-collapse">
                    <thead>
                      <tr className="border-b border-slate-800 bg-slate-950 text-slate-400">
                        <th className="p-3 w-1/4">Neterminal</th>
                        <th className="p-3 w-3/8 text-cyan-400">FIRST(A)</th>
                        <th className="p-3 w-3/8 text-indigo-400">FOLLOW(A)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {currentGrammar.nonterminals.map(nt => (
                        <tr key={nt} className="hover:bg-slate-800/30 transition-colors">
                          <td className="p-3 font-bold text-white flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-indigo-400"></span>
                            {nt}
                          </td>
                          <td className="p-3">
                            <span className="p-1 px-2.5 rounded-lg bg-cyan-950/50 border border-cyan-500/30 text-cyan-300 font-bold">
                              &#123; {currentGrammar.firstSets[nt].join(", ")} &#125;
                            </span>
                          </td>
                          <td className="p-3">
                            <span className="p-1 px-2.5 rounded-lg bg-indigo-950/50 border border-indigo-500/30 text-indigo-300 font-bold">
                              &#123; {currentGrammar.followSets[nt].join(", ")} &#125;
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="p-4 bg-rose-950/30 border border-rose-500/30 rounded-2xl text-xs text-rose-300 space-y-1">
                  <strong className="text-rose-400 block font-mono">Regulă Verificată la Examen:</strong>
                  <p>
                    Observă că nicio mulțime <code>FOLLOW</code> nu conține simbolul <code>&epsilon;</code>! În schimb, pentru simbolul de start <code>{currentGrammar.startSymbol}</code>, marcajul de sfârșit <code>$</code> este prezent din oficiu.
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: LL(1) Parsing Table */}
          {activeTab === "table" && (
            <div className="space-y-6">
              <div className="p-6 bg-slate-900/60 border border-slate-800 rounded-3xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white flex items-center gap-2">
                    <span className="w-6 h-6 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xs font-mono">M</span>
                    Tabelul Predictiv de Parsare LL(1) M[A, a]
                  </h3>
                  <span className="px-3 py-1 rounded-full text-xs font-mono font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                    Proprietate LL(1): VALIDĂ (0 Conflicte)
                  </span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-center text-xs font-mono border-collapse">
                    <thead>
                      <tr className="border-b border-slate-800 bg-slate-950 text-slate-400">
                        <th className="p-3 text-left">Neterm.</th>
                        {ll1Table.cols.map(col => (
                          <th key={col} className="p-3 text-cyan-400">{col}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {currentGrammar.nonterminals.map(nt => (
                        <tr key={nt} className="hover:bg-slate-800/30">
                          <td className="p-3 text-left font-bold text-white">{nt}</td>
                          {ll1Table.cols.map(col => {
                            let entries = ll1Table.matrix[nt][col];
                            if (entries.length === 0) {
                              return <td key={col} className="p-3 text-slate-700 bg-slate-950/40">&mdash;</td>;
                            }
                            return (
                              <td key={col} className="p-2">
                                {entries.map((item, i) => (
                                  <div 
                                    key={i} 
                                    className={`p-1.5 rounded-lg border text-[11px] font-bold ${
                                      item.reason === "FIRST"
                                        ? "bg-cyan-950/40 border-cyan-500/30 text-cyan-300"
                                        : "bg-purple-950/40 border-purple-500/30 text-purple-300"
                                    }`}
                                  >
                                    {item.prod.lhs} &rarr; {item.prod.rhs.join(" ")}
                                  </div>
                                ))}
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="flex flex-wrap gap-4 text-xs font-mono pt-2 text-slate-400">
                  <span className="flex items-center gap-1.5">
                    <span className="w-3 h-3 rounded bg-cyan-950/60 border border-cyan-500/30"></span>
                    Regulă adăugată conform FIRST(&alpha;)
                  </span>
                  <span className="flex items-center gap-1.5">
                    <span className="w-3 h-3 rounded bg-purple-950/60 border border-purple-500/30"></span>
                    Regulă adăugată conform &epsilon; &isin; FIRST(&alpha;) &rArr; FOLLOW(A)
                  </span>
                </div>
              </div>
            </div>
          )}

          {/* TAB 3: Stack Parser Simulation */}
          {activeTab === "stack" && (
            <div className="space-y-6">
              {/* Simulation Controls */}
              <div className="p-6 bg-slate-900/60 border border-slate-800 rounded-3xl space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-4">
                  <h3 className="text-lg font-bold text-white flex items-center gap-2">
                    <span className="w-6 h-6 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xs font-mono">▶</span>
                    Simulator Stivă LL(1) pe Șir de Intrare
                  </h3>
                  <button
                    onClick={initParsing}
                    className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white transition-all shadow-md shadow-indigo-600/30"
                  >
                    🚀 Rulează Parsarea Completă
                  </button>
                </div>

                <div className="flex items-center gap-3">
                  <label className="text-xs font-mono text-slate-400 whitespace-nowrap">Șir Tokeni:</label>
                  <input
                    type="text"
                    value={stackInput}
                    onChange={(e) => setStackInput(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-mono text-cyan-300 focus:outline-none focus:border-indigo-500"
                    placeholder="ex: id + id * id $"
                  />
                </div>
              </div>

              {/* Execution Steps Trace */}
              {stepHistory.length > 0 && (
                <div className="p-6 bg-slate-900/60 border border-slate-800 rounded-3xl space-y-4">
                  <div className="flex items-center justify-between">
                    <h4 className="text-sm font-bold text-white font-mono">
                      Jurnalul Execuției Pas cu Pas:
                    </h4>
                    <span className="text-xs font-mono text-slate-400">
                      Total Pași: <strong className="text-white">{stepHistory.length}</strong>
                    </span>
                  </div>

                  <div className="overflow-x-auto max-h-96 overflow-y-auto">
                    <table className="w-full text-left text-xs font-mono border-collapse">
                      <thead className="sticky top-0 bg-slate-950 border-b border-slate-800 text-slate-400">

                          <th className="p-2.5 w-1/3 text-cyan-400">Stivă (Vârf în Dreapta)</th>
                          <th className="p-2.5 w-1/4 text-slate-300">Intrare Rămasă</th>

                      <tbody className="divide-y divide-slate-800/60">

                            key={idx} 
                            className={`hover:bg-slate-800/30 transition-colors ${
                              s.status === "ACCEPTED" 
                                ? "bg-emerald-950/30 text-emerald-300"

                              {s.remaining.join(" ")}
                            </td>
                            <td className="p-2.5 font-semibold">

                            </td>

                      </tbody>
                    </table>

                </div>

          {/* TAB 4: Recursive Descent C++ Generator */}
          {activeTab === "cpp" && (

                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                  <span className="w-6 h-6 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xs font-mono">&lt;/&gt;</span>
                  Cod C++ Generat pentru Coborâre Recursivă (cf. lexer_parser.pdf)
                </h3>
                <span className="text-xs text-slate-400 font-mono">Format Didactic UCV</span>
              </div>

              <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800 font-mono text-xs overflow-x-auto">
                <pre className="text-slate-300 leading-relaxed">
{`#include <iostream>
#include <string>
#include <cstdlib>

using namespace std;

// Token definitions
enum TokenType { TOKEN_ID, TOKEN_PLUS, TOKEN_MUL, TOKEN_LPAREN, TOKEN_RPAREN, TOKEN_END, TOKEN_ERR };

TokenType lookahead;

void syntaxError(const string &msg) {
    cerr << "Eroare sintactica: " << msg << endl;
    exit(1);
}

void match(TokenType expected) {
    if (lookahead == expected) {
        // In real project: lookahead = yylex();
        cout << "Matched token: " << expected << endl;
    } else {
        syntaxError("Token neasteptat la potrivire!");
    }
}

// Prototipuri pentru neterminalele gramaticii: ${currentGrammar.nonterminals.join(", ")}
${currentGrammar.nonterminals.map(nt => `void parse_${nt.replace("'", "_prime")}();`).join("\n")}

${currentGrammar.nonterminals.map(nt => {
  let cleanName = nt.replace("'", "_prime");
  let prods = currentGrammar.productions.filter(p => p.lhs === nt);
  return `void parse_${cleanName}() {
    // Parser function for non-terminal: ${nt}
    cout << "Entering parse_${cleanName}" << endl;
    ${prods.map(p => {
      let isEps = p.rhs[0] === "eps";
      if (isEps) return `    // epsilon production\n    return;`;
      return `    // Producție: ${p.lhs} -> ${p.rhs.join(" ")}`;
    }).join("\n")}
}`;
}).join("\n\n")}

int main() {
    // Start parsing from root: ${currentGrammar.startSymbol}
    parse_${currentGrammar.startSymbol}();
    match(TOKEN_END);
    cout << "Parsare terminata cu succes!" << endl;
    return 0;
}`}
                </pre>
              </div>
            </div>
          )}

          </footer>
        </main>
      );
    }
