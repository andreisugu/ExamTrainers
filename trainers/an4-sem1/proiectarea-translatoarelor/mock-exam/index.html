    function App() {
      // Exam State
      const [examStarted, setExamStarted] = useState(false);
      const [examFinished, setExamFinished] = useState(false);
      const [timeLeft, setTimeLeft] = useState(3600); // 60 minutes
      const [activeQuestions, setActiveQuestions] = useState([]);
      const [userAnswers, setUserAnswers] = useState({});
      const [flagged, setFlagged] = useState({});
      const [currentQIndex, setCurrentQIndex] = useState(0);

      // Start Exam with 15 randomly selected questions
      const startExam = () => {
        // shuffle and pick 15
        const shuffled = [...QUESTION_BANK].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, 15);
        setActiveQuestions(selected);
        setUserAnswers({});
        setFlagged({});
        setCurrentQIndex(0);
        setTimeLeft(3600);
        setExamStarted(true);
        setExamFinished(false);
      };

      // Timer countdown
      useEffect(() => {
        if (!examStarted || examFinished) return;
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timer);
              setExamFinished(true);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [examStarted, examFinished]);

      // Format seconds as mm:ss
      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      // Handle Option Select
      const selectOption = (optIdx) => {
        if (examFinished) return;
        setUserAnswers({
          ...userAnswers,
          [currentQIndex]: optIdx
        });
      };

      // Toggle Flag
      const toggleFlag = (qIdx) => {
        setFlagged({
          ...flagged,
          [qIdx]: !flagged[qIdx]
        });
      };

      // Submit Exam
      const submitExam = () => {
        if (window.confirm("Ești sigur că vrei să finalizezi examenul și să transmiți răspunsurile?")) {
          setExamFinished(true);
        }
      };

      // Compute Score & Stats
      const scoreData = useMemo(() => {
        if (!examFinished || activeQuestions.length === 0) return null;
        let correctCount = 0;
        let catStats = {};

        activeQuestions.forEach((q, idx) => {
          let userAns = userAnswers[idx];
          let isCorrect = userAns === q.correct;
          if (isCorrect) correctCount++;

          if (!catStats[q.cat]) {
            catStats[q.cat] = { correct: 0, total: 0 };
          }
          catStats[q.cat].total++;
          if (isCorrect) catStats[q.cat].correct++;
        });

        // Grade on scale 1-10: 1 + (correct / total) * 9
        let grade = (1 + (correctCount / activeQuestions.length) * 9).toFixed(2);
        return {
          correctCount,
          total: activeQuestions.length,
          grade,
          passed: grade >= 5.0,
          catStats
        };
      }, [examFinished, activeQuestions, userAnswers]);

      const currentQ = activeQuestions[currentQIndex];

      return (
        <main className="relative mx-auto flex min-h-screen w-full max-w-6xl flex-col px-4 py-8 sm:px-6 lg:px-8 justify-between">
          
          {/* Header */}
          <header className="mb-8 pb-6 border-b border-slate-800 flex flex-wrap items-center justify-between gap-4">
            <nav className="flex items-center space-x-2 text-sm text-slate-400 font-medium">
              <a href="../../../index.html" className="hover:text-white transition-colors">ExamTrainers</a>
              <span className="text-slate-600">/</span>
              <a href="../index.html" className="hover:text-white transition-colors">Proiectarea Translatoarelor</a>
              <span className="text-slate-600">/</span>
              <span className="text-amber-400 font-bold bg-amber-500/10 px-2.5 py-0.5 rounded border border-amber-500/20 font-mono">Mock Exam Simulat</span>
            </nav>

            <div className="flex items-center gap-3">
              <a href="theory.html" className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-xs font-semibold text-slate-200 transition-all">
                <span>📜</span>
                <span>Cele 10 Porunci</span>
              </a>
              <a href="../index.html" className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-800 bg-slate-900/60 hover:bg-slate-800 text-xs font-semibold text-slate-400 hover:text-white transition-all">
                <span>&larr;</span>
                <span>Dashboard PT</span>
              </a>
            </div>
          </header>

          {/* Intro Screen */}
          {!examStarted && (
            <section className="space-y-8 max-w-3xl mx-auto py-12 text-center animate-fade-in">
              <div className="inline-flex p-4 rounded-3xl bg-amber-500/10 border border-amber-500/30 text-amber-400 text-3xl">
                ⏱️
              </div>
              <div className="space-y-3">
                <h1 className="text-3xl sm:text-5xl font-black tracking-tight text-white">
                  Simulatorul Oficial de Examen PT
                </h1>
                <p className="text-base text-slate-400 leading-relaxed">
                  Test cronometrat de 60 de minute conform cerințelor de la Universitatea din Craiova. 15 întrebări extrase aleatoriu din banca de curs și laborator. Calculul automat al notei de la 1 la 10 și raport detaliat de justificare pentru fiecare întrebare.
                </p>
              </div>

              <div className="grid sm:grid-cols-3 gap-4 text-left font-mono text-xs">
                <div className="p-4 bg-slate-900/60 border border-slate-800 rounded-2xl">
                  <span className="text-amber-400 font-bold block mb-1">Durată Examen:</span>
                  <p className="text-white font-bold text-sm">60 de Minute</p>
                </div>
                <div className="p-4 bg-slate-900/60 border border-slate-800 rounded-2xl">
                  <span className="text-cyan-400 font-bold block mb-1">Total Întrebări:</span>
                  <p className="text-white font-bold text-sm">15 Grile Ponderate</p>
                </div>
                <div className="p-4 bg-slate-900/60 border border-slate-800 rounded-2xl">
                  <span className="text-emerald-400 font-bold block mb-1">Criteriu Promovare:</span>
                  <p className="text-white font-bold text-sm">Nota minimă 5.00</p>
                </div>
              </div>

              <button
                onClick={startExam}
                className="px-8 py-4 rounded-2xl bg-amber-600 hover:bg-amber-500 text-sm font-bold text-white transition-all shadow-xl shadow-amber-600/30 active:scale-95"
              >
                🚀 Începe Examenul Simulat
              </button>
            </section>
          )}

          {/* Exam Interface */}
          {examStarted && (
            <div className="space-y-6">
              
              {/* Top Status Bar: Timer & Actions */}
              <div className="p-4 bg-slate-900/80 border border-slate-800 rounded-2xl flex flex-wrap items-center justify-between gap-4 sticky top-4 z-20 backdrop-blur-xl">
                <div className="flex items-center gap-3">
                  <span className={`px-4 py-2 rounded-xl font-mono text-base font-bold flex items-center gap-2 border ${
                    timeLeft < 600 
                      ? "bg-rose-950/60 border-rose-500 text-rose-300 animate-pulse" 
                      : "bg-slate-950 border-slate-800 text-amber-300"
                  }`}>
                    <span>⏱️</span>
                    <span>{formatTime(timeLeft)}</span>
                  </span>
                  <span className="text-xs text-slate-400 font-mono">
                    Răspunse: <strong className="text-white">{Object.keys(userAnswers).length}</strong> / 15
                  </span>
                </div>

                <div className="flex items-center gap-3">
                  <button
                    onClick={() => toggleFlag(currentQIndex)}
                    className={`px-3 py-1.5 rounded-xl border text-xs font-mono font-bold transition-all ${
                      flagged[currentQIndex]
                        ? "bg-amber-500/20 border-amber-500 text-amber-300"
                        : "bg-slate-950 border-slate-800 text-slate-400 hover:text-white"
                    }`}
                  >
                    🚩 {flagged[currentQIndex] ? "Marcată" : "Marchează"}
                  </button>

                  {!examFinished ? (
                    <button
                      onClick={submitExam}
                      className="px-4 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white transition-all shadow-md shadow-emerald-600/30"
                    >
                      ✓ Finalizează Testul
                    </button>
                  ) : (
                    <button
                      onClick={startExam}
                      className="px-4 py-1.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-xs font-bold text-white transition-all shadow-md shadow-cyan-600/30"
                    >
                      🔄 Test Nou
                    </button>
                  )}
                </div>
              </div>

              {/* Score Results Card (If Finished) */}
              {examFinished && scoreData && (
                <div className={`p-8 rounded-3xl border text-center space-y-4 animate-fade-in ${
                  scoreData.passed 
                    ? "bg-emerald-950/30 border-emerald-500/40" 
                    : "bg-rose-950/30 border-rose-500/40"
                }`}>
                  <span className="text-4xl">{scoreData.passed ? "🎉" : "📚"}</span>
                  <h2 className="text-2xl sm:text-3xl font-black text-white">
                    {scoreData.passed ? "Examen Promovat cu Succes!" : "Examen Nepromovat (Sub nota 5.00)"}
                  </h2>
                  <div className="inline-block p-4 rounded-2xl bg-slate-950 border border-slate-800 font-mono">
                    <span className="text-slate-400 text-xs block">Nota Finală de Examen:</span>
                    <span className={`text-4xl font-extrabold ${scoreData.passed ? "text-emerald-400" : "text-rose-400"}`}>
                      {scoreData.grade} / 10.00
                    </span>
                    <span className="text-slate-500 text-xs block mt-1">
                      ({scoreData.correctCount} din {scoreData.total} grile corecte)
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 max-w-xl mx-auto">
                    Navighează prin întrebările de mai jos pentru a citi explicațiile teoretice pas cu pas și a înțelege capcanele fiecărui răspuns incorect.
                  </p>
                </div>
              )}

              {/* Question Navigation Bar (1 to 15) */}
              <div className="flex flex-wrap gap-2 p-3 bg-slate-900/60 border border-slate-800 rounded-2xl">
                {activeQuestions.map((q, idx) => {
                  let isAnswered = userAnswers[idx] !== undefined;
                  let isFlagged = flagged[idx];
                  let isCurrent = idx === currentQIndex;

                  let borderClass = "border-slate-800";
                  let bgClass = "bg-slate-950 text-slate-400";

                  if (isCurrent) {
                    borderClass = "border-amber-400 shadow-md shadow-amber-400/20";
                  }

                  if (examFinished) {
                    let isCorrect = userAnswers[idx] === q.correct;
                    bgClass = isCorrect ? "bg-emerald-950 text-emerald-300 border-emerald-500/40" : "bg-rose-950 text-rose-300 border-rose-500/40";
                  } else if (isAnswered) {
                    bgClass = "bg-cyan-950/60 text-cyan-300 border-cyan-500/30";
                  }

                  return (
                    <button
                      key={idx}
                      onClick={() => setCurrentQIndex(idx)}
                      className={`w-9 h-9 rounded-xl font-mono text-xs font-bold border transition-all flex items-center justify-center relative ${borderClass} ${bgClass}`}
                    >
                      {idx + 1}
                      {isFlagged && !examFinished && (
                        <span className="w-2 h-2 rounded-full bg-amber-400 absolute -top-1 -right-1"></span>
                      )}
                    </button>
                  );
                })}
              </div>

              {/* Active Question Card */}
              {currentQ && (
                <div className="p-8 bg-slate-900/60 border border-slate-800 rounded-3xl space-y-6 animate-fade-in">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                    <span className="text-xs font-mono font-bold text-amber-400 uppercase tracking-wider">
                      Întrebarea {currentQIndex + 1} din 15 &bull; Categoria {currentQ.cat}
                    </span>
                    <span className="text-xs text-slate-500 font-mono">
                      {currentQ.title}
                    </span>
                  </div>

                  <p className="text-base font-semibold text-white leading-relaxed">
                    {currentQ.text}
                  </p>

                  {/* Options */}
                  <div className="space-y-3">
                    {currentQ.options.map((opt, optIdx) => {
                      let isSelected = userAnswers[currentQIndex] === optIdx;
                      let isCorrect = currentQ.correct === optIdx;

                      let itemClass = "bg-slate-950/80 border-slate-800 text-slate-300 hover:border-slate-700 hover:bg-slate-900";

                      if (isSelected) {
                        itemClass = "bg-cyan-950/40 border-cyan-500 text-cyan-200 font-semibold";
                      }

                      if (examFinished) {
                        if (isCorrect) {
                          itemClass = "bg-emerald-950/60 border-emerald-500 text-emerald-200 font-bold";
                        } else if (isSelected && !isCorrect) {
                          itemClass = "bg-rose-950/60 border-rose-500 text-rose-200";
                        }
                      }

                      return (
                        <div
                          key={optIdx}
                          onClick={() => selectOption(optIdx)}
                          className={`p-4 rounded-2xl border text-xs font-mono cursor-pointer transition-all flex items-center justify-between ${itemClass}`}
                        >
                          <span>{opt}</span>
                          {examFinished && isCorrect && (
                            <span className="text-emerald-400 font-bold">✓ Răspuns Corect</span>
                          )}
                          {examFinished && isSelected && !isCorrect && (
                            <span className="text-rose-400 font-bold">✗ Răspunsul Tău</span>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  {/* Explanation (Shown when Exam Finished) */}
                  {examFinished && (
                    <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800 text-xs font-mono text-slate-300 space-y-2 mt-4">
                      <strong className="text-amber-400 block font-bold">Explicație Teoretică & Demontare Capcană:</strong>
                      <p className="leading-relaxed">{currentQ.exp}</p>
                    </div>
                  )}

                  {/* Question Bottom Navigation */}
                  <div className="flex items-center justify-between pt-4 border-t border-slate-800">
                    <button
                      onClick={() => setCurrentQIndex(prev => Math.max(0, prev - 1))}
                      disabled={currentQIndex === 0}
                      className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-xs font-bold text-white transition-all"
                    >
                      &larr; Înapoi
                    </button>
                    <span className="text-xs font-mono text-slate-500">
                      {currentQIndex + 1} / 15
                    </span>
                    <button
                      onClick={() => setCurrentQIndex(prev => Math.min(activeQuestions.length - 1, prev + 1))}
                      disabled={currentQIndex === activeQuestions.length - 1}
                      className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-xs font-bold text-white transition-all"
                    >
                      Înainte &rarr;
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Footer */}
          <footer className="mt-12 py-6 border-t border-slate-900 text-center text-xs text-slate-600 font-semibold tracking-wide uppercase">
            &copy; 2026 ExamTrainers. Simulator Examen Proiectarea Translatoarelor — Universitatea din Craiova.
          </footer>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
